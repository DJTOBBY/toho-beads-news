name: Deploy to Lolipop (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lolipop-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate OGP tags from latest article
        run: python3 scripts/generate_ogp.py

      - name: Deploy over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: news/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/scripts/__pycache__/**
