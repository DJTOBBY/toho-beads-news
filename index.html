<!DOCTYPE html>

<head>

<title>トーホービーズ ワールドニュース</title>
<link rel="stylesheet" href="style.css">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d3a63">

<link rel="icon" type="image/png" sizes="32x32" href="images/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="images/icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="images/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="logo-badge">

        <span class="logo-text">TOHO<span class="logo-text-accent">BEADS</span></span>

    <div class="toolbar">

        <button class="filter-btn active" data-category="all">すべて</button>

    <section class="upcoming-section" id="upcoming-section" hidden>

    </section>

  <footer class="site-footer">
    <p>本サイトは公開情報をもとに独自に要約したファンメイドのニュースまとめです。TOHO CO., LTD. 公式サイトではありません。</p>
  </footer>

  <script src="script.js"></script>
